name: Validate Terraform
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04 # Upgrade the runner OS deliberately.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -lockfile=readonly
      - run: terraform validate
      - run: terraform test
      - name: Test single-app customer inputs
        run: terraform test -test-directory=tests/examples -var-file=examples/single-app/terraform.tfvars.example
      - name: Test multiple-app customer inputs
        run: |
          cp examples/multiple-apps/terraform.tfvars.json.example .terraform/multiple-apps-test.tfvars.json
          terraform test -test-directory=tests/examples -var-file=.terraform/multiple-apps-test.tfvars.json
